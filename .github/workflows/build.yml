name: 构建与发布

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
            artifact: windows-x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
            artifact: windows-arm64
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 安装前端依赖
        run: npm ci
      - name: 构建 Windows 安装包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles nsis
      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            artifact: macos-x64
          - target: aarch64-apple-darwin
            artifact: macos-aarch64
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 安装前端依赖
        run: npm ci
      - name: 构建 macOS DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code signing + notarization. When these secrets are unset the
          # Tauri CLI silently skips signing (producing an unsigned build, same
          # as before); when set it signs with the Developer ID cert and runs
          # notarytool + stapler automatically. No manual keychain steps needed.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles app,dmg
      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x64
            artifact: linux-x64
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            artifact: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev xdg-utils
      - name: 安装前端依赖
        run: npm ci
      - name: 构建 Linux AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles appimage
      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.sig
          if-no-files-found: error

  release:
    name: 汇总并发布
    runs-on: ubuntu-latest
    needs: [windows, macos, linux]
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
      - name: 下载所有平台产物
        uses: actions/download-artifact@v4
        with:
          path: release/artifacts
      - name: 生成 Tauri 更新索引
        run: node scripts/make_latest_json.cjs
      - name: 上传汇总产物
        uses: actions/upload-artifact@v4
        with:
          name: BeeAPI-Switch-release
          path: release/update/*
          if-no-files-found: error
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BeeAPI Switch ${{ github.ref_name }}
          body: |
            本次更新：
            - 版本号升级到 0.1.4。
            - 软件启动时自动检查 GitHub Release 更新，有新版本时自动下载安装。
            - 发布流程会生成 Tauri 自动更新所需的 latest.json。
          files: release/update/*
